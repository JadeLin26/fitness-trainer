<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>体态训练</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <meta name="theme-color" content="#007AFF">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>体态训练</h1>
    <div class="subtitle">所有训练 · 一页搞定</div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="date date-display"></div>
    <div class="actions">
      <button class="icon-btn btn-period" title="生理周期"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E91E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2C8 6 5 9.5 5 13a7 7 0 0 0 14 0c0-3.5-3-7-7-11z"/></svg></button>
      <button class="icon-btn btn-weight" title="体重记录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M12 4.5v2"/><path d="M9 4.5h6"/><circle cx="12" cy="13" r="3"/></svg></button>
      <button class="icon-btn btn-mute" title="静音"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
      <button class="icon-btn btn-export" title="训练统计"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></button>
    </div>
  </div>

  <!-- Progress summary -->
  <div class="progress-summary">
    <svg class="ring" viewBox="0 0 44 44">
      <circle class="ring-bg" cx="22" cy="22" r="18" />
      <circle class="ring-fg summary-ring-fg" cx="22" cy="22" r="18"
        stroke-dasharray="113.1" stroke-dashoffset="113.1"
        transform="rotate(-90 22 22)" />
    </svg>
    <div class="info">
      <div class="label progress-label">今日完成 0%</div>
      <div class="value progress-value">0/0</div>
    </div>
    <div class="cal-info">
      <div class="cal-number">🔥 0 kcal</div>
      <div class="cal-equiv"></div>
    </div>
  </div>

  <!-- Group toggle -->
  <div class="group-toggle">
    <button class="group-btn active" data-group="category">按部位</button>
    <button class="group-btn" data-group="scene">按场景</button>
  </div>

  <!-- Exercise list -->
  <div class="exercise-list"></div>

  <!-- Stats panel -->
  <div class="stats-panel" style="display:none">
    <div class="stats-topbar">
      <button class="stats-back">← 返回</button>
      <span class="stats-title">训练统计</span>
      <button class="stats-export" title="导出CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    </div>
    <div class="stats-week-nav">
      <button class="stats-prev">‹</button>
      <span class="stats-week-label">本周</span>
      <button class="stats-next">›</button>
    </div>
    <div class="stats-heatmap"></div>
    <div class="stats-summary"></div>
    <div class="stats-day-detail"></div>
  </div>

  <!-- Weight panel -->
  <div class="weight-panel" style="display:none">
    <div class="stats-topbar">
      <button class="weight-back">← 返回</button>
      <span class="stats-title">体重记录</span>
      <span></span>
    </div>
    <div class="weight-input-area">
      <div class="weight-input-row">
        <input type="number" class="weight-input" placeholder="输入体重" step="0.1" min="30" max="200" inputmode="decimal">
        <span class="weight-unit">kg</span>
        <button class="weight-save">记录</button>
      </div>
      <div class="weight-bmi-display"></div>
    </div>
    <div class="weight-chart-container">
      <canvas class="weight-chart"></canvas>
    </div>
    <div class="weight-history"></div>
  </div>

  <!-- Period panel -->
  <div class="period-panel" style="display:none">
    <div class="stats-topbar">
      <button class="period-back">← 返回</button>
      <span class="stats-title">生理周期</span>
      <span></span>
    </div>
    <div class="period-nav">
      <button class="period-prev">‹</button>
      <span class="period-month-label"></span>
      <button class="period-next">›</button>
    </div>
    <div class="period-calendar"></div>
    <div class="period-info"></div>
    <div class="period-actions"></div>
    <div class="period-history"></div>
  </div>

  <!-- Training overlay (fullscreen) -->
  <div class="training-overlay">
    <div class="training-header">
      <div class="training-title"></div>
      <div class="training-subtitle"></div>
    </div>

    <div class="ring-container">
      <svg viewBox="0 0 220 220" width="100%" height="100%">
        <circle class="ring-timer-bg" cx="110" cy="110" r="100" />
        <circle class="ring-timer-fg" cx="110" cy="110" r="100"
          stroke-dasharray="628.3" stroke-dashoffset="0"
          transform="rotate(-90 110 110)" />
      </svg>
      <div class="ring-center">
        <div class="ring-number">-</div>
        <div class="ring-label">准备</div>
      </div>
    </div>

    <div class="training-info">
      <div class="training-overall">
        <div class="training-progress-bar"><div class="training-progress-fill"></div></div>
        <div class="training-progress-label"></div>
        <div class="training-remaining"></div>
      </div>
      <div class="training-progress-text"></div>
      <div class="training-tips"></div>
    </div>

    <div class="training-controls">
      <button class="btn-training btn-pause">暂停</button>
      <button class="btn-training btn-resume" style="display:none">继续</button>
      <button class="btn-training btn-stop">结束</button>
    </div>
  </div>

  <script type="module">
    import { init } from './js/app.js';
    init();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
